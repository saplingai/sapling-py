[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sapling-py"
dynamic = ["version"]
description = "Sapling Python Client"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "Apache License 2.0" }
authors = [
    { name = "Sapling Intelligence", email = "info@sapling.ai" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "requests",
]

[project.optional-dependencies]
test = [
    "pytest",
    "responses",
]

[project.urls]
Homepage = "https://sapling.ai"
Documentation = "https://sapling.readthedocs.io/"
Repository = "https://github.com/saplingai/sapling-py"

[tool.setuptools.dynamic]
version = { attr = "sapling.version.__version__" }

[tool.setuptools.packages.find]
include = ["sapling", "sapling.*"]
exclude = ["test", "test.*"]
namespaces = false
